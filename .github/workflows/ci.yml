name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: npm ci --prefix src/featurelens/js --ignore-scripts
      - run: uv run pytest -q
      - run: uv build
